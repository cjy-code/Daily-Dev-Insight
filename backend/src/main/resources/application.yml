spring:
  application:
    name: daily-dev-insight
  thymeleaf:
    encoding: UTF-8
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/ORCLPDB}
    username: ${DB_USERNAME:daily}
    password: ${DB_PASSWORD:1234}
    driver-class-name: ${DB_DRIVER:oracle.jdbc.OracleDriver}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:3s}
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  cache:
    type: redis
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  port: 9090

llm:
  provider: ${LLM_PROVIDER:openai}

openai:
  base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  model: ${OPENAI_MODEL:gpt-4.1-mini}
  api-key: ${OPENAI_API_KEY:}

crawler:
  user-agent: ${CRAWLER_USER_AGENT:DailyDevInsightBot/1.0}
  thumbnail-upload-dir: ${CRAWLER_THUMBNAIL_UPLOAD_DIR:./uploads}


