<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layouts/authLayout :: layout(~{::title}, ~{::link}, ~{::.auth-brand}, ~{::section}, ~{})}">
<head>
    <title>관리자 로그인 | Daily Dev Insight</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
</head>
<body>
<div class="auth-brand">
    <img class="auth-brand-logo" th:src="@{/images/brand-logo-trimmed.png}" src="/images/brand-logo-trimmed.png" alt="오늘의 인사이트">
    <div class="login-switch login-switch-float admin" role="group" aria-label="로그인 유형 전환">
        <a class="login-switch-btn" th:href="@{/login}">사용자 로그인</a>
        <span class="login-switch-btn is-active" aria-current="page">관리자 로그인</span>
    </div>
</div>
<section class="login-panel admin">
    <span class="login-chip admin">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v6c0 4.4 3 7.6 7.5 9 4.5-1.4 7.5-4.6 7.5-9V6L12 3Z"/></svg>
        Admin Console
    </span>
    <h1 class="login-title">관리자 로그인</h1>
    <p class="login-subtitle">관리자 ID와 비밀번호를 입력해 주세요.</p>

    <div class="login-notice login-notice-error" th:if="${adminLoginError}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <span>관리자 ID 또는 비밀번호가 올바르지 않습니다.</span>
    </div>
    <div class="login-notice login-notice-error" th:if="${adminDeniedError}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <span>관리자 권한이 없어 해당 페이지에 접근할 수 없습니다.</span>
    </div>
    <div class="login-notice login-notice-error" th:if="${adminCsrfError}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <span>보안 토큰 검증에 실패했습니다. 관리자 화면을 새로고침 후 다시 시도해 주세요.</span>
    </div>
    <div class="login-notice login-notice-success" th:if="${adminLogoutSuccess}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
        <span>로그아웃되었습니다.</span>
    </div>

    <form method="post" th:action="@{/admin/login}" class="login-form" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="login-field">
            <label class="login-field-label" for="username">관리자 ID</label>
            <div class="login-field-shell">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg>
                <input class="login-input" id="username" name="username" type="text" autocomplete="username" required>
            </div>
        </div>

        <div class="login-field">
            <label class="login-field-label" for="password">비밀번호</label>
            <div class="login-field-shell">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="9.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
                <input class="login-input" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
        </div>

        <button class="login-btn-primary" type="submit">관리자 로그인</button>
    </form>

    <p class="login-admin-note">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:2px;flex-shrink:0;"><circle cx="12" cy="12" r="9"/><path d="M12 8v.01M12 11v5"/></svg>
        관리자 계정은 내부 발급된 ID로만 로그인할 수 있습니다.
    </p>
</section>
</body>
</html>
