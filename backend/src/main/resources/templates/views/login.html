<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layouts/authLayout :: layout(~{::title}, ~{::link}, ~{::section}, ~{})}">
<head>
    <title>사용자 로그인 | Daily Dev Insight</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
</head>
<body>
<section class="auth-panel card">
    <h2 class="auth-title">사용자 로그인</h2>
    <p class="auth-subtitle">사용자 ID와 비밀번호를 입력해 주세요.</p>

    <div class="notice-box notice-error" th:if="${loginError}">
        사용자 ID 또는 비밀번호가 올바르지 않습니다.
    </div>
    <div class="notice-box notice-success" th:if="${logoutSuccess}">
        로그아웃되었습니다.
    </div>

    <form method="post" th:action="@{/login}" class="auth-form" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="form-field">
            <label class="field-label" for="username">사용자 ID</label>
            <input class="input-field" id="username" name="username" type="text" autocomplete="username" required>
        </div>

        <div class="form-field">
            <label class="field-label" for="password">비밀번호</label>
            <input class="input-field" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <button class="btn-primary" type="submit">로그인</button>
    </form>

    <section class="social-login-wrap">
        <p class="social-login-title">소셜 로그인</p>
        <div class="social-login-list">
            <a class="social-login-item" href="javascript:void(0)">Google 로그인</a>
            <a class="social-login-item" href="javascript:void(0)">Kakao 로그인</a>
            <a class="social-login-item" href="javascript:void(0)">Naver 로그인</a>
        </div>
        <p class="social-login-note">소셜 로그인 기능은 준비 중입니다.</p>
    </section>

    <div class="auth-link-row">
        <a th:href="@{/admin/login}">관리자 로그인으로 이동</a>
    </div>
</section>
</body>
</html>
