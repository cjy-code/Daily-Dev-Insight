<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layouts/authLayout :: layout(~{::title}, ~{::link}, ~{::.auth-brand}, ~{::section}, ~{})}">
<head>
    <title>사용자 로그인 | Daily Dev Insight</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
</head>
<body>
<div class="auth-brand">
    <img class="auth-brand-logo" th:src="@{/images/brand-logo-trimmed.png}" src="/images/brand-logo-trimmed.png" alt="오늘의 인사이트">
    <div class="login-switch login-switch-float" role="group" aria-label="로그인 유형 전환">
        <span class="login-switch-btn is-active" aria-current="page">사용자 로그인</span>
        <a class="login-switch-btn" th:href="@{/admin/login}">관리자 로그인</a>
    </div>
</div>
<section class="login-panel">
    <span class="login-chip">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.2-6 7-6s7 2.4 7 6"/></svg>
        User Login
    </span>
    <h1 class="login-title">사용자 로그인</h1>
    <p class="login-subtitle">사용자 ID와 비밀번호를 입력해 주세요.</p>

    <div class="login-notice login-notice-error" th:if="${loginError}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <span>사용자 ID 또는 비밀번호가 올바르지 않습니다.</span>
    </div>
    <div class="login-notice login-notice-success" th:if="${logoutSuccess}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
        <span>로그아웃되었습니다.</span>
    </div>
    <div class="login-notice login-notice-success" th:if="${withdrawSuccess}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
        <span>회원탈퇴가 처리되었습니다.</span>
    </div>

    <form method="post" th:action="@{/login}" class="login-form" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="login-field">
            <label class="login-field-label" for="username">사용자 ID</label>
            <div class="login-field-shell">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg>
                <input class="login-input" id="username" name="username" type="text" autocomplete="username" required>
            </div>
        </div>

        <div class="login-field">
            <label class="login-field-label" for="password">비밀번호</label>
            <div class="login-field-shell">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="9.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
                <input class="login-input" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
        </div>

        <button class="login-btn-primary" type="submit">로그인</button>
    </form>

    <div class="login-divider">소셜 로그인</div>
    <div class="login-sns-grid">
        <a class="login-sns-btn" href="javascript:void(0)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.2c0-.7-.06-1.36-.18-2H12v3.8h5.05c-.22 1.2-.9 2.2-1.9 2.9v2.4h3.1c1.8-1.66 2.85-4.1 2.85-7.1Z"/><path d="M12 21c2.4 0 4.5-.8 6-2.2l-3.1-2.4c-.8.55-1.85.9-2.9.9-2.25 0-4.15-1.5-4.85-3.55H3.9v2.5A9 9 0 0 0 12 21Z"/><path d="M7.15 13.75a5.4 5.4 0 0 1 0-3.5v-2.5H3.9a9 9 0 0 0 0 8.5l3.25-2.5Z"/><path d="M12 6.75c1.3 0 2.5.45 3.4 1.35l2.55-2.55A9 9 0 0 0 3.9 7.75l3.25 2.5c.7-2.05 2.6-3.5 4.85-3.5Z"/></svg>
            Google
        </a>
        <a class="login-sns-btn" href="javascript:void(0)">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5c-5.25 0-9.5 3.36-9.5 7.5 0 2.67 1.77 5.02 4.44 6.35-.2.72-.72 2.6-.82 3-.13.5.18.5.38.36.16-.1 2.53-1.72 3.56-2.42.63.09 1.28.14 1.94.14 5.25 0 9.5-3.36 9.5-7.43S17.25 3.5 12 3.5Z"/></svg>
            Kakao
        </a>
        <a class="login-sns-btn" href="javascript:void(0)">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4.2l4 6.3V4H18v16h-4.2l-4-6.3V20H6V4Z"/></svg>
            Naver
        </a>
    </div>
    <p class="login-sns-note" style="margin:10px 0 0;font-size:12px;color:var(--color-text-muted);text-align:center;">소셜 로그인 기능은 준비 중입니다.</p>
</section>
</body>
</html>
