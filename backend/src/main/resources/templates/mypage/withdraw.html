<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layouts/defaultLayout :: layout(~{::title}, ~{::link}, ~{::section}, ~{}, true, false, ~{::aside})}">
<head>
    <title>회원탈퇴 | Daily Dev Insight</title>
    <link rel="stylesheet" th:href="@{/css/mypage.css}" href="/css/mypage.css">
</head>
<body>
<section class="mypage-shell card">
    <aside th:replace="~{fragments/mypageNav :: mypageNav(${currentMenu})}"></aside>

    <section class="mypage-content">
        <header class="mypage-head">
            <h2>회원탈퇴</h2>
            <p>탈퇴 시 로그인할 수 없으며 북마크/좋아요 데이터가 삭제됩니다.</p>
        </header>

        <div class="notice-box notice-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form method="post" th:action="@{/mypage/withdraw}" class="mypage-form" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-field">
                <label class="field-label" for="currentPassword">비밀번호 확인</label>
                <input class="input-field" id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
            </div>

            <label class="checkbox-wrap" for="agreeWithdraw">
                <input id="agreeWithdraw" name="agreeWithdraw" type="checkbox" value="Y">
                <span>탈퇴 시 유의사항을 확인했고, 탈퇴에 동의합니다.</span>
            </label>

            <button class="btn-danger" type="submit">회원탈퇴</button>
        </form>
    </section>
</section>
</body>
</html>
