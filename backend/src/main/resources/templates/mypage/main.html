<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layouts/defaultLayout :: layout(~{::title}, ~{::link}, ~{::section}, ~{}, true, false, ~{::aside})}">
<head>
    <title>마이페이지 | Daily Dev Insight</title>
    <link rel="stylesheet" th:href="@{/css/mypage.css}" href="/css/mypage.css">
</head>
<body>
<section class="mypage-shell card">
    <aside th:replace="~{fragments/mypageNav :: mypageNav(${currentMenu})}"></aside>

    <section class="mypage-content">
        <header class="mypage-head">
            <h2>마이페이지</h2>
            <p>계정정보와 활동 내역을 확인할 수 있습니다.</p>
        </header>

        <div class="mypage-grid">
            <article class="mypage-panel">
                <h3>내 정보</h3>
                <dl class="mypage-dl">
                    <dt>사용자 ID</dt><dd th:text="${profile.userId}">user</dd>
                    <dt>이름</dt><dd th:text="${profile.name}">이름</dd>
                    <dt>이메일</dt><dd th:text="${profile.email}">email@example.com</dd>
                </dl>
            </article>

            <article class="mypage-panel">
                <h3>활동 요약</h3>
                <dl class="mypage-dl">
                    <dt>북마크</dt><dd th:text="${activity.bookmarkCount}">0</dd>
                    <dt>좋아요</dt><dd th:text="${activity.likeCount}">0</dd>
                </dl>
                <a class="btn-primary mypage-btn" th:href="@{/mypage/activity}">활동 내역 보기</a>
            </article>
        </div>
    </section>
</section>
</body>
</html>
