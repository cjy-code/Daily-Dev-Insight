<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layouts/defaultLayout :: layout(~{::title}, ~{::link}, ~{::section}, ~{}, true, false, ~{::aside})}">
<head>
    <title>비밀번호 변경 | Daily Dev Insight</title>
    <link rel="stylesheet" th:href="@{/css/mypage.css}" href="/css/mypage.css">
</head>
<body>
<section class="mypage-shell card">
    <aside th:replace="~{fragments/mypageNav :: mypageNav(${currentMenu})}"></aside>

    <section class="mypage-content">
        <header class="mypage-head">
            <h2>비밀번호 변경</h2>
            <p>현재 비밀번호 확인 후 새 비밀번호를 등록합니다.</p>
        </header>

        <div class="notice-box notice-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="notice-box notice-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form method="post" th:action="@{/mypage/password}" class="mypage-form" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-field">
                <label class="field-label" for="currentPassword">현재 비밀번호</label>
                <input class="input-field" id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
            </div>

            <div class="form-field">
                <label class="field-label" for="newPassword">새 비밀번호</label>
                <input class="input-field" id="newPassword" name="newPassword" type="password" autocomplete="new-password" required>
            </div>

            <div class="form-field">
                <label class="field-label" for="newPasswordConfirm">새 비밀번호 확인</label>
                <input class="input-field" id="newPasswordConfirm" name="newPasswordConfirm" type="password" autocomplete="new-password" required>
            </div>

            <button class="btn-primary" type="submit">변경하기</button>
        </form>
    </section>
</section>
</body>
</html>
