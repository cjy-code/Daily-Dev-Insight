<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layouts/defaultLayout :: layout(~{::title}, ~{::link}, ~{::section}, ~{}, true, false, ~{::aside})}">
<head>
    <title>회원정보 수정 | Daily Dev Insight</title>
    <link rel="stylesheet" th:href="@{/css/mypage.css}" href="/css/mypage.css">
</head>
<body>
<section class="mypage-shell card">
    <aside th:replace="~{fragments/mypageNav :: mypageNav(${currentMenu})}"></aside>

    <section class="mypage-content">
        <header class="mypage-head">
            <h2>회원정보 수정</h2>
            <p>이름과 이메일 정보를 변경할 수 있습니다.</p>
        </header>

        <div class="notice-box notice-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="notice-box notice-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form method="post" th:action="@{/mypage/profile}" class="mypage-form" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-field">
                <label class="field-label" for="userId">사용자 ID</label>
                <input class="input-field" id="userId" name="userId" type="text" th:value="${profile.userId}" readonly>
            </div>

            <div class="form-field">
                <label class="field-label" for="name">이름</label>
                <input class="input-field" id="name" name="name" type="text" th:value="${profile.name}" required>
            </div>

            <div class="form-field">
                <label class="field-label" for="email">이메일</label>
                <input class="input-field" id="email" name="email" type="email" th:value="${profile.email}" required>
            </div>

            <button class="btn-primary" type="submit">수정하기</button>
        </form>
    </section>
</section>
</body>
</html>
