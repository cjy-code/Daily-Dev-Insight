<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | Daily Dev Insight</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: linear-gradient(135deg, #eff6ff, #f8fafc);
            color: #0f172a;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(2, 6, 23, 0.10);
            padding: 28px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }
        .subtitle {
            margin: 0 0 20px;
            color: #64748b;
            font-size: 14px;
        }
        .field {
            display: grid;
            gap: 6px;
            margin-bottom: 14px;
        }
        .email-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 8px;
            align-items: center;
        }
        .at-mark {
            color: #475569;
            font-weight: 700;
        }
        label {
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }
        select {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
            background: #fff;
        }
        select:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }
        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            background: #0369a1;
            color: #ffffff;
            font-weight: 700;
            padding: 11px 14px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .alert {
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .alert-success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .error-message {
            margin: 4px 0 0;
            font-size: 12px;
            color: #b91c1c;
            min-height: 16px;
        }
        .sns-login {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #e2e8f0;
        }
        .sns-title {
            margin: 0 0 10px;
            font-size: 13px;
            color: #64748b;
        }
        .sns-buttons {
            display: grid;
            gap: 8px;
        }
        .sns-btn {
            display: block;
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 12px;
            font-weight: 600;
            text-align: center;
            color: #0f172a;
            background: #fff;
            text-decoration: none;
            cursor: default;
        }
    </style>
</head>
<body>
<main class="login-card">
    <h1>로그인</h1>
    <p class="subtitle">Daily Dev Insight 접근을 위해 로그인하세요.</p>

    <div class="alert alert-error" th:if="${loginError}">
        사용자 ID 또는 비밀번호가 올바르지 않습니다.
    </div>
    <div class="alert alert-success" th:if="${logoutSuccess}">
        로그아웃되었습니다.
    </div>

    <form id="loginForm" method="post" th:action="@{/login}" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" id="username" name="username">
        <div class="field">
            <label for="emailId">이메일</label>
            <div class="email-row">
                <input id="emailId" type="text" autocomplete="username" placeholder="이메일 아이디" required>
                <span class="at-mark">@</span>
                <select id="emailDomain" required>
                    <option value="">도메인 선택</option>
                    <option value="daily.com">daily.com</option>
                    <option value="gmail.com">gmail.com</option>
                    <option value="naver.com">naver.com</option>
                    <option value="daum.net">daum.net</option>
                    <option value="kakao.com">kakao.com</option>
                    <option value="custom">직접입력</option>
                </select>
            </div>
            <input id="customDomain" type="text" placeholder="도메인 직접입력 (예: company.com)" style="display:none; margin-top:8px;">
            <p class="error-message" id="emailError"></p>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <p class="error-message" id="passwordError"></p>
        </div>
        <button id="loginButton" type="submit" disabled>로그인</button>
    </form>

    <section class="sns-login">
        <p class="sns-title">SNS 로그인 (준비중)</p>
        <div class="sns-buttons">
            <a class="sns-btn" href="javascript:void(0)">Google 로그인</a>
            <a class="sns-btn" href="javascript:void(0)">Kakao 로그인</a>
            <a class="sns-btn" href="javascript:void(0)">Naver 로그인</a>
        </div>
    </section>
</main>
<script>
    (function () {
        const form = document.getElementById("loginForm");
        const emailIdInput = document.getElementById("emailId");
        const domainSelect = document.getElementById("emailDomain");
        const customDomainInput = document.getElementById("customDomain");
        const usernameHidden = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const loginButton = document.getElementById("loginButton");
        const emailError = document.getElementById("emailError");
        const passwordError = document.getElementById("passwordError");

        function getDomain() {
            if (domainSelect.value === "custom") {
                return customDomainInput.value.trim();
            }
            return domainSelect.value;
        }

        function buildEmail() {
            const emailId = emailIdInput.value.trim();
            const domain = getDomain();
            if (!emailId || !domain) {
                return "";
            }
            return emailId + "@" + domain;
        }

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function validate() {
            const emailId = emailIdInput.value.trim();
            const domain = getDomain();
            const password = passwordInput.value;
            const email = buildEmail();
            let valid = true;

            emailError.textContent = "";
            passwordError.textContent = "";

            if (!emailId) {
                emailError.textContent = "이메일 아이디를 입력해 주세요.";
                valid = false;
            } else if (!domain) {
                emailError.textContent = "이메일 도메인을 선택하거나 입력해 주세요.";
                valid = false;
            } else if (!isValidEmail(email)) {
                emailError.textContent = "올바른 이메일 형식으로 입력해 주세요.";
                valid = false;
            }

            if (!password) {
                passwordError.textContent = "비밀번호를 입력해 주세요.";
                valid = false;
            }

            usernameHidden.value = email;
            loginButton.disabled = !valid;
            return valid;
        }

        domainSelect.addEventListener("change", function () {
            const isCustom = domainSelect.value === "custom";
            customDomainInput.style.display = isCustom ? "block" : "none";
            if (!isCustom) {
                customDomainInput.value = "";
            }
            validate();
        });

        emailIdInput.addEventListener("input", validate);
        customDomainInput.addEventListener("input", validate);
        passwordInput.addEventListener("input", validate);

        form.addEventListener("submit", function (event) {
            if (!validate()) {
                event.preventDefault();
            }
        });

        validate();
    })();
</script>
</body>
</html>
