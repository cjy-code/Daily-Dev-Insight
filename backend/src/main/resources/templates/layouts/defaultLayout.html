<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:fragment="layout(pageTitle, pageHead, content, pageScript, showHeaderNav, showSidebar, sidebarContent)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${pageTitle}">Daily Dev Insight</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}" href="/css/layout.css">
    <th:block th:replace="${pageHead}"></th:block>
</head>
<body>
<div class="layout-shell" th:classappend="${showSidebar} ? ' layout-shell-with-sidebar' : ''">
    <div class="layout-container">
        <header th:replace="~{fragments/header :: header(${showHeaderNav})}"></header>

        <main class="content-wrap">
            <th:block th:replace="${content}">
                <section>Content</section>
            </th:block>
        </main>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
    <aside class="layout-sidebar-external" th:if="${showSidebar}">
        <th:block th:replace="${sidebarContent}">
            <section>Sidebar</section>
        </th:block>
    </aside>
</div>
<th:block th:replace="${pageScript}"></th:block>
</body>
</html>
