<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:fragment="layout(pageTitle, pageHead, pageBrand, content, pageScript)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${pageTitle}">Daily Dev Insight</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}" href="/css/layout.css">
    <th:block th:replace="${pageHead}"></th:block>
</head>
<body>
<div class="layout-container auth-layout-container">
    <main class="content-wrap auth-content-wrap">
        <th:block th:replace="${pageBrand}"></th:block>
        <th:block th:replace="${content}">
            <section>Content</section>
        </th:block>
    </main>
</div>
<th:block th:replace="${pageScript}"></th:block>
</body>
</html>
