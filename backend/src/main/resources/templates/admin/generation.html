<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layouts/defaultLayout :: layout(~{::title}, ~{::link}, ~{::section}, ~{::script}, true, false, ~{::aside})}">
<head>
    <title>일일 지식 | Daily Dev Insight</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css">
</head>
<body>
<section class="admin-shell">
    <aside th:replace="~{fragments/adminNav :: adminNav(${currentMenu})}"></aside>
    <section class="admin-content">
        <header class="admin-topbar">
            <h2>일일 지식 관리</h2>
            <p>프롬프트, 수동 생성, 예약 생성, 생성 이력을 분리 관리합니다.</p>
        </header>

        <div class="alert success" th:if="${adminMessage}" th:text="${adminMessage}"></div>
        <div class="alert error" th:if="${adminError}">
            <strong th:if="${adminErrorCode}" th:text="'오류 코드: ' + ${adminErrorCode}">오류 코드: sample_code</strong>
            <p th:text="${adminError}">오류 메시지</p>
        </div>

        <nav class="admin-tab-nav" aria-label="생성 관리 탭">
            <button type="button" class="admin-tab-btn active" data-tab-target="prompt">프롬프트 템플릿</button>
            <button type="button" class="admin-tab-btn" data-tab-target="manual" data-requires-active-template="true">수동 생성</button>
            <button type="button" class="admin-tab-btn" data-tab-target="schedule" data-requires-active-template="true">예약 생성</button>
            <button type="button" class="admin-tab-btn" data-tab-target="history">생성 이력</button>
        </nav>

        <section class="admin-panel generation-tab-panel" data-tab-panel="prompt"
                 th:attr="data-active-template-name=${activeTemplate != null ? activeTemplate.name : ''},data-has-active-template=${activeTemplate != null},data-template-count=${#lists.size(templateList)},data-max-template-count=10">
            <h3>프롬프트 템플릿</h3>
            <div class="active-template-card">
                <strong>현재 활성 템플릿</strong>
                <p th:if="${activeTemplate != null}">
                    <span th:text="${activeTemplate.name}">기본 템플릿</span>
                    <span class="active-template-meta"
                          th:text="'(수정일: ' + ${#temporals.format(activeTemplate.updatedAt, 'yyyy-MM-dd HH:mm:ss')} + ')'">(수정일: -)</span>
                </p>
                <p th:if="${activeTemplate == null}" class="inactive-text">현재 활성화된 템플릿이 없습니다.</p>
            </div>
            <div class="template-limit-guide" th:text="'템플릿 수: ' + ${#lists.size(templateList)} + ' / 10'">템플릿 수: 1 / 10</div>
            <form method="post" th:action="@{/admin/prompts}" class="admin-form" id="promptTemplateForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="id" id="promptId">

                <label for="promptName">템플릿 이름</label>
                <input type="text" id="promptName" name="name" required>

                <label for="promptDescription">설명</label>
                <input type="text" id="promptDescription" name="description">

                <label for="templateContent">프롬프트 본문</label>
                <textarea id="templateContent" name="templateContent" rows="8" required></textarea>

                <div class="btn-row">
                    <button type="submit" id="savePromptTemplateButton">저장</button>
                    <button type="button" class="secondary" id="resetPromptForm">초기화</button>
                </div>
            </form>

            <table class="admin-table" id="promptTemplateTable">
                <thead>
                <tr>
                    <th class="admin-sort-th" data-sort-key="id">ID <span class="sort-indicator"></span></th>
                    <th class="admin-sort-th" data-sort-key="name">이름 <span class="sort-indicator"></span></th>
                    <th>활성</th>
                    <th class="admin-sort-th" data-sort-key="updatedAt">수정일시 <span class="sort-indicator"></span></th>
                    <th>작업</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="template : ${templateList}"
                    th:attr="data-template-id=${template.id},data-template-name=${template.name},data-template-updated-at=${#temporals.format(template.updatedAt, 'yyyyMMddHHmmss')}">
                    <td th:text="${template.id}">1</td>
                    <td th:text="${template.name}">기본 템플릿</td>
                    <td th:text="${template.active} ? 'Y' : 'N'">Y</td>
                    <td th:text="${#temporals.format(template.updatedAt, 'yyyy-MM-dd HH:mm:ss')}">-</td>
                    <td class="table-actions">
                        <button type="button" class="secondary load-template-btn"
                                th:attr="data-id=${template.id},data-name=${template.name},data-description=${template.description},data-content=${template.templateContent}">편집</button>
                        <form method="post"
                              th:action="@{/admin/prompts/{id}/toggle-active(id=${template.id})}"
                              class="prompt-toggle-form"
                              th:attr="data-template-active=${template.active},data-template-name=${template.name}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit"
                                    th:classappend="${template.active} ? ' secondary' : ''"
                                    th:text="${template.active} ? '비활성화' : '활성화'">활성화</button>
                        </form>
                        <form method="post" th:action="@{/admin/prompts/{id}/delete(id=${template.id})}"
                              onsubmit="return confirm('프롬프트 템플릿을 삭제하시겠습니까?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="danger"
                                    th:disabled="${template.active}"
                                    th:title="${template.active} ? '활성 템플릿은 삭제할 수 없습니다.' : ''">삭제</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </section>

        <section class="admin-panel generation-tab-panel" data-tab-panel="manual" hidden>
            <h3>수동 생성</h3>
            <form method="post" th:action="@{/admin/generate}" class="admin-form" id="manualGenerationForm">
                <label for="targetDate">대상 날짜</label>
                <input type="date" id="targetDate" name="targetDate" th:value="${generationRequestForm.targetDate}" required>
                <label for="category">카테고리</label>
                <input type="text" id="category" name="category" th:value="${generationRequestForm.category}" required>
                <label for="tone">톤</label>
                <input type="text" id="tone" name="tone" th:value="${generationRequestForm.tone}" required>
                <label for="difficulty">난이도</label>
                <input type="text" id="difficulty" name="difficulty" th:value="${generationRequestForm.difficulty}" required>
                <button type="button" id="openManualGenerationComposeWindow">지금 생성</button>
            </form>
        </section>

        <section class="admin-panel generation-tab-panel" data-tab-panel="schedule" hidden>
            <h3>예약 생성</h3>
            <form method="post" th:action="@{/admin/schedule}" class="admin-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label class="checkbox-label"><input type="checkbox" name="enabled" value="true" th:checked="${scheduleForm.enabled}">예약 실행 활성화</label>
                <label for="cronExpression">Cron 표현식 (초 분 시 일 월 요일)</label>
                <input type="text" id="cronExpression" name="cronExpression" th:value="${scheduleForm.cronExpression}" required>
                <label for="scheduleCategory">카테고리</label>
                <input type="text" id="scheduleCategory" name="category" th:value="${scheduleForm.category}" required>
                <label for="scheduleTone">톤</label>
                <input type="text" id="scheduleTone" name="tone" th:value="${scheduleForm.tone}" required>
                <label for="scheduleDifficulty">난이도</label>
                <input type="text" id="scheduleDifficulty" name="difficulty" th:value="${scheduleForm.difficulty}" required>
                <button type="submit">예약 저장</button>
            </form>
        </section>

        <section class="admin-panel generation-tab-panel" data-tab-panel="history" hidden>
            <h3>생성 이력</h3>
            <table class="admin-table history-table" id="generationHistoryTable">
                <thead>
                <tr>
                    <th class="admin-sort-th" data-history-sort-key="createdAt">일시 <span class="sort-indicator"></span></th>
                    <th class="admin-sort-th" data-history-sort-key="triggerType">트리거 <span class="sort-indicator"></span></th>
                    <th class="admin-sort-th" data-history-sort-key="targetDate">대상일 <span class="sort-indicator"></span></th>
                    <th class="admin-sort-th" data-history-sort-key="status">상태 <span class="sort-indicator"></span></th>
                    <th class="admin-sort-th" data-history-sort-key="createdKnowledgeId">생성 ID <span class="sort-indicator"></span></th>
                    <th>오류</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="history : ${historyList}"
                    th:attr="data-history-created-at=${#temporals.format(history.createdAt, 'yyyyMMddHHmmss')},data-history-trigger-type=${history.triggerType},data-history-target-date=${#temporals.format(history.targetDate, 'yyyyMMdd')},data-history-status=${history.status},data-history-created-knowledge-id=${history.createdKnowledgeId != null ? history.createdKnowledgeId : 0}">
                    <td th:text="${#temporals.format(history.createdAt, 'yyyy-MM-dd HH:mm:ss')}">-</td>
                    <td><span class="history-trigger-badge" th:text="${history.triggerType}">MANUAL</span></td>
                    <td th:text="${history.targetDate}">-</td>
                    <td>
                        <span class="history-status-badge"
                              th:classappend="${history.status == 'SUCCESS'} ? ' success' : ' failed'"
                              th:text="${history.status}">SUCCESS</span>
                    </td>
                    <td th:text="${history.createdKnowledgeId}">12</td>
                    <td class="history-error-cell">
                        <span th:if="${history.errorMessage != null && !#strings.isEmpty(history.errorMessage)}"
                              class="history-error-trigger"
                              th:text="${history.errorMessage}"
                              th:title="${history.errorMessage}">-</span>
                        <textarea th:if="${history.errorMessage != null && !#strings.isEmpty(history.errorMessage)}"
                                  class="history-error-full"
                                  hidden
                                  th:text="${history.errorMessage}"></textarea>
                        <span th:if="${history.errorMessage == null || #strings.isEmpty(history.errorMessage)}">-</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(historyList)}">
                    <td colspan="6">생성 이력이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </section>

        <div id="historyErrorModalOverlay" class="history-error-modal-overlay" aria-hidden="true">
            <section class="history-error-modal" role="dialog" aria-modal="true" aria-labelledby="historyErrorModalTitle">
                <header class="history-error-modal-header">
                    <h3 id="historyErrorModalTitle">상세 오류</h3>
                </header>
                <div class="history-error-modal-body">
                    <pre id="historyErrorModalContent"></pre>
                </div>
                <footer class="history-error-modal-footer">
                    <button type="button" class="secondary" id="historyErrorModalClose">창닫기</button>
                </footer>
            </section>
        </div>
    </section>
</section>
<aside></aside>
<script th:src="@{/js/admin.js}" src="/js/admin.js"></script>
</body>
</html>
