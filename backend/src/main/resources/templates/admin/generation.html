<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layouts/defaultLayout :: layout(~{::title}, ~{::link}, ~{::section}, ~{::script}, true, false, ~{::aside})}">
<head>
    <title>생성 관리 | Daily Dev Insight</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css">
</head>
<body>
<section class="admin-shell">
    <aside th:replace="~{fragments/adminNav :: adminNav(${currentMenu})}"></aside>
    <section class="admin-content">
        <header class="admin-topbar">
            <h2>생성 관리</h2>
            <p>프롬프트, 수동 생성, 예약 생성, 생성 이력을 분리 관리합니다.</p>
        </header>

        <div class="alert success" th:if="${adminMessage}" th:text="${adminMessage}"></div>
        <div class="alert error" th:if="${adminError}" th:text="${adminError}"></div>

        <section class="admin-panel">
            <h3>프롬프트 템플릿</h3>
            <form method="post" th:action="@{/admin/prompts}" class="admin-form" id="promptTemplateForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="id" id="promptId">

                <label for="promptName">템플릿 이름</label>
                <input type="text" id="promptName" name="name" required>

                <label for="promptDescription">설명</label>
                <input type="text" id="promptDescription" name="description">

                <label for="templateContent">프롬프트 본문</label>
                <textarea id="templateContent" name="templateContent" rows="8" required></textarea>

                <div class="btn-row">
                    <button type="submit">저장</button>
                    <button type="button" class="secondary" id="resetPromptForm">초기화</button>
                </div>
            </form>

            <table class="admin-table">
                <thead>
                <tr><th>ID</th><th>이름</th><th>활성</th><th>수정일시</th><th>작업</th></tr>
                </thead>
                <tbody>
                <tr th:each="template : ${templateList}">
                    <td th:text="${template.id}">1</td>
                    <td th:text="${template.name}">기본 템플릿</td>
                    <td th:text="${template.active} ? 'Y' : 'N'">Y</td>
                    <td th:text="${#temporals.format(template.updatedAt, 'yyyy-MM-dd HH:mm:ss')}">2026-04-15 10:00:00</td>
                    <td class="table-actions">
                        <button type="button" class="secondary load-template-btn"
                                th:attr="data-id=${template.id},data-name=${template.name},data-description=${template.description},data-content=${template.templateContent}">편집</button>
                        <form method="post" th:action="@{/admin/prompts/{id}/activate(id=${template.id})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" th:disabled="${template.active}">활성화</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </section>

        <section class="admin-panel">
            <h3>수동 생성</h3>
            <form method="post" th:action="@{/admin/generate}" class="admin-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label for="targetDate">대상 날짜</label>
                <input type="date" id="targetDate" name="targetDate" th:value="${generationRequestForm.targetDate}" required>
                <label for="category">카테고리</label>
                <input type="text" id="category" name="category" th:value="${generationRequestForm.category}" required>
                <label for="tone">톤</label>
                <input type="text" id="tone" name="tone" th:value="${generationRequestForm.tone}" required>
                <label for="difficulty">난이도</label>
                <input type="text" id="difficulty" name="difficulty" th:value="${generationRequestForm.difficulty}" required>
                <button type="submit">지금 생성</button>
            </form>
        </section>

        <section class="admin-panel">
            <h3>예약 생성</h3>
            <form method="post" th:action="@{/admin/schedule}" class="admin-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label class="checkbox-label"><input type="checkbox" name="enabled" value="true" th:checked="${scheduleForm.enabled}">예약 실행 활성화</label>
                <label for="cronExpression">Cron 표현식 (초 분 시 일 월 요일)</label>
                <input type="text" id="cronExpression" name="cronExpression" th:value="${scheduleForm.cronExpression}" required>
                <label for="scheduleCategory">카테고리</label>
                <input type="text" id="scheduleCategory" name="category" th:value="${scheduleForm.category}" required>
                <label for="scheduleTone">톤</label>
                <input type="text" id="scheduleTone" name="tone" th:value="${scheduleForm.tone}" required>
                <label for="scheduleDifficulty">난이도</label>
                <input type="text" id="scheduleDifficulty" name="difficulty" th:value="${scheduleForm.difficulty}" required>
                <button type="submit">예약 저장</button>
            </form>
        </section>

        <section class="admin-panel">
            <h3>생성 이력</h3>
            <table class="admin-table">
                <thead>
                <tr><th>일시</th><th>트리거</th><th>대상일</th><th>상태</th><th>생성 ID</th><th>오류</th></tr>
                </thead>
                <tbody>
                <tr th:each="history : ${historyList}">
                    <td th:text="${#temporals.format(history.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2026-04-15 10:00:00</td>
                    <td th:text="${history.triggerType}">MANUAL</td>
                    <td th:text="${history.targetDate}">2026-04-15</td>
                    <td th:text="${history.status}">SUCCESS</td>
                    <td th:text="${history.createdKnowledgeId}">12</td>
                    <td th:text="${history.errorMessage}">-</td>
                </tr>
                <tr th:if="${#lists.isEmpty(historyList)}">
                    <td colspan="6">생성 이력이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </section>
    </section>
</section>
<aside></aside>
<script th:src="@{/js/admin.js}" src="/js/admin.js"></script>
</body>
</html>
