<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layouts/defaultLayout :: layout(~{::title}, ~{::link}, ~{::section}, ~{}, true, false, ~{::aside})}">
<head>
    <title>테크 뉴스 관리 | Daily Dev Insight</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css">
</head>
<body>
<section class="admin-shell">
    <aside th:replace="~{fragments/adminNav :: adminNav(${currentMenu})}"></aside>
    <section class="admin-content">
        <header class="admin-topbar">
            <h2>게시물 관리 - 테크 뉴스</h2>
            <p>최근 테크 뉴스 게시물의 출처/제목 및 썸네일을 수정하거나 삭제할 수 있습니다.</p>
        </header>

        <div class="alert success" th:if="${adminMessage}" th:text="${adminMessage}"></div>
        <div class="alert error" th:if="${adminError}" th:text="${adminError}"></div>
        <div class="alert error" th:if="${param.csrfError}">
            보안 토큰이 만료되었거나 유효하지 않습니다. 페이지를 새로고침 후 다시 시도해 주세요.
        </div>

        <section class="admin-panel">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>날짜</th>
                    <th>출처</th>
                    <th>제목</th>
                    <th>조회수</th>
                    <th>썸네일</th>
                    <th>작업</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="post : ${techNewsPostList}">
                    <td th:text="${post.id}">1</td>
                    <td th:text="${post.newsDate}">2026-04-15</td>
                    <td>
                        <input type="text"
                               th:id="'news-source-' + ${post.id}"
                               th:form="'news-update-form-' + ${post.id}"
                               name="source"
                               th:value="${post.source}"
                               required>
                    </td>
                    <td>
                        <input type="text"
                               th:id="'news-title-' + ${post.id}"
                               th:form="'news-update-form-' + ${post.id}"
                               name="title"
                               th:value="${post.title}"
                               required>
                    </td>
                    <td th:text="${post.viewCount}">0</td>
                    <td class="thumbnail-cell">
                        <div class="admin-thumbnail-preview">
                            <img th:if="${post.attachmentImagePath != null and !#strings.isEmpty(post.attachmentImagePath)}"
                                 th:src="${post.attachmentImagePath}"
                                 src="/images/default-thumb.svg"
                                 alt="썸네일"
                                 onerror="this.onerror=null;this.src='/images/default-thumb.svg';">
                            <div class="admin-thumbnail-empty"
                                 th:unless="${post.attachmentImagePath != null and !#strings.isEmpty(post.attachmentImagePath)}">
                                썸네일 없음
                            </div>
                        </div>
                        <form method="post"
                              th:action="@{/admin/posts/news/{id}/thumbnail(id=${post.id},_csrf=${_csrf.token})}"
                              enctype="multipart/form-data"
                              class="admin-thumbnail-upload-form">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="file"
                                   name="thumbnailFile"
                                   accept=".jpg,.jpeg,.png,.webp,.gif,image/*"
                                   required>
                            <button type="submit" class="secondary">업로드</button>
                        </form>
                    </td>
                    <td class="table-actions">
                        <form method="post"
                              th:id="'news-update-form-' + ${post.id}"
                              th:action="@{/admin/posts/news/{id}/update(id=${post.id})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit">수정</button>
                        </form>
                        <form method="post" th:action="@{/admin/posts/news/{id}/thumbnail/delete(id=${post.id})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="secondary">썸네일 삭제</button>
                        </form>
                        <form method="post" th:action="@{/admin/posts/news/{id}/delete(id=${post.id})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="danger">삭제</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(techNewsPostList)}">
                    <td colspan="7">게시물이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </section>
    </section>
</section>
<aside></aside>
</body>
</html>
