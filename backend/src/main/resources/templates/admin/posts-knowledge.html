<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layouts/defaultLayout :: layout(~{::title}, ~{::link}, ~{::section}, ~{}, true, false, ~{::aside})}">
<head>
    <title>일일 지식 관리 | Daily Dev Insight</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css">
</head>
<body>
<section class="admin-shell">
    <aside th:replace="~{fragments/adminNav :: adminNav(${currentMenu})}"></aside>
    <section class="admin-content">
        <header class="admin-topbar">
            <h2>게시물 관리 - 일일 지식</h2>
            <p>최근 일일 지식 게시물의 카테고리/제목을 수정하거나 삭제할 수 있습니다.</p>
        </header>

        <div class="alert success" th:if="${adminMessage}" th:text="${adminMessage}"></div>
        <div class="alert error" th:if="${adminError}" th:text="${adminError}"></div>

        <section class="admin-panel">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>날짜</th>
                    <th>카테고리</th>
                    <th>제목</th>
                    <th>조회수</th>
                    <th>작업</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="post : ${knowledgePostList}">
                    <td th:text="${post.id}">1</td>
                    <td th:text="${post.knowledgeDate}">2026-04-15</td>
                    <td>
                        <form method="post" th:action="@{/admin/posts/knowledge/{id}/update(id=${post.id})}" class="inline-form">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="text" name="category" th:value="${post.category}" required>
                    </td>
                    <td>
                            <input type="text" name="title" th:value="${post.title}" required>
                    </td>
                    <td th:text="${post.viewCount}">0</td>
                    <td class="table-actions">
                            <button type="submit">수정</button>
                        </form>
                        <form method="post" th:action="@{/admin/posts/knowledge/{id}/delete(id=${post.id})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="danger">삭제</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(knowledgePostList)}">
                    <td colspan="6">게시물이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </section>
    </section>
</section>
<aside></aside>
</body>
</html>
