<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layouts/defaultLayout :: layout(~{::title}, ~{::link}, ~{::section}, ~{::script}, true, false, ~{::aside})}">
<head>
    <title>크롤링 관리 | Daily Dev Insight</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css">
</head>
<body>
<section class="admin-shell">
    <aside th:replace="~{fragments/adminNav :: adminNav(${currentMenu})}"></aside>
    <section class="admin-content">
        <header class="admin-topbar">
            <h2>크롤링 관리</h2>
            <p>수동 실행, 예약 실행, 크롤링 이력을 분리 관리합니다.</p>
        </header>

        <div class="alert success" th:if="${adminMessage}" th:text="${adminMessage}"></div>
        <div class="alert error" th:if="${adminError}">
            <strong th:if="${adminErrorCode}" th:text="'오류 코드: ' + ${adminErrorCode}">오류 코드: crawl_failed</strong>
            <p th:text="${adminError}">오류 메시지</p>
        </div>

        <nav class="admin-tab-nav" aria-label="크롤링 관리 탭">
            <button type="button" class="admin-tab-btn active" data-tab-target="manual">수동 실행</button>
            <button type="button" class="admin-tab-btn" data-tab-target="schedule">예약 설정</button>
            <button type="button" class="admin-tab-btn" data-tab-target="history">크롤링 이력</button>
        </nav>

        <section class="admin-panel generation-tab-panel" data-tab-panel="manual">
            <h3>수동 실행</h3>
            <form method="post" th:action="@{/admin/crawling/run}" class="admin-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <label for="crawlTargetDate">대상 날짜</label>
                <input type="date" id="crawlTargetDate" name="targetDate" th:value="${crawlRunForm.targetDate}" required>

                <label for="crawlSourceName">소스 이름</label>
                <input type="text" id="crawlSourceName" name="sourceName" th:value="${crawlRunForm.sourceName}" required>

                <label for="crawlSourceUrl">소스 URL(RSS)</label>
                <input type="url" id="crawlSourceUrl" name="sourceUrl" th:value="${crawlRunForm.sourceUrl}" required>

                <label for="crawlMaxArticles">최대 수집 건수</label>
                <input type="number" id="crawlMaxArticles" name="maxArticles" min="1" max="100" th:value="${crawlRunForm.maxArticles}" required>

                <button type="submit">지금 실행</button>
            </form>
        </section>

        <section class="admin-panel generation-tab-panel" data-tab-panel="schedule" hidden>
            <h3>예약 설정</h3>
            <form method="post" th:action="@{/admin/crawling/schedule}" class="admin-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <label class="checkbox-label">
                    <input type="checkbox" name="enabled" value="true" th:checked="${crawlScheduleForm.enabled}">예약 실행 활성화
                </label>

                <label for="crawlCronExpression">Cron 표현식 (초 분 시 일 월 요일)</label>
                <input type="text" id="crawlCronExpression" name="cronExpression" th:value="${crawlScheduleForm.cronExpression}" required>

                <label for="crawlScheduleSourceName">소스 이름</label>
                <input type="text" id="crawlScheduleSourceName" name="sourceName" th:value="${crawlScheduleForm.sourceName}" required>

                <label for="crawlScheduleSourceUrl">소스 URL(RSS)</label>
                <input type="url" id="crawlScheduleSourceUrl" name="sourceUrl" th:value="${crawlScheduleForm.sourceUrl}" required>

                <label for="crawlScheduleMaxArticles">최대 수집 건수</label>
                <input type="number" id="crawlScheduleMaxArticles" name="maxArticles" min="1" max="100"
                       th:value="${crawlScheduleForm.maxArticles}" required>

                <button type="submit">예약 저장</button>
            </form>
        </section>

        <section class="admin-panel generation-tab-panel" data-tab-panel="history" hidden>
            <h3>크롤링 이력</h3>
            <table class="admin-table history-table" id="generationHistoryTable">
                <thead>
                <tr>
                    <th class="admin-sort-th" data-history-sort-key="createdAt">일시 <span class="sort-indicator"></span></th>
                    <th class="admin-sort-th" data-history-sort-key="triggerType">트리거 <span class="sort-indicator"></span></th>
                    <th class="admin-sort-th" data-history-sort-key="targetDate">대상일 <span class="sort-indicator"></span></th>
                    <th class="admin-sort-th" data-history-sort-key="status">상태 <span class="sort-indicator"></span></th>
                    <th>소스</th>
                    <th>요청</th>
                    <th>수집</th>
                    <th class="admin-sort-th" data-history-sort-key="insertedCount">신규 저장 <span class="sort-indicator"></span></th>
                    <th>오류</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="history : ${crawlHistoryList}"
                    th:attr="data-history-created-at=${#temporals.format(history.createdAt, 'yyyyMMddHHmmss')},data-history-trigger-type=${history.triggerType},data-history-target-date=${#temporals.format(history.targetDate, 'yyyyMMdd')},data-history-status=${history.status},data-history-inserted-count=${history.insertedCount}">
                    <td th:text="${#temporals.format(history.createdAt, 'yyyy-MM-dd HH:mm:ss')}">-</td>
                    <td><span class="history-trigger-badge" th:text="${history.triggerType}">MANUAL</span></td>
                    <td th:text="${history.targetDate}">-</td>
                    <td>
                        <span class="history-status-badge"
                              th:classappend="${history.status == 'SUCCESS'} ? ' success' : ' failed'"
                              th:text="${history.status}">SUCCESS</span>
                    </td>
                    <td th:text="${history.sourceName}">Hacker News</td>
                    <td th:text="${history.requestedCount}">20</td>
                    <td th:text="${history.collectedCount}">20</td>
                    <td th:text="${history.insertedCount}">20</td>
                    <td class="history-error-cell">
                        <span th:if="${history.errorMessage != null && !#strings.isEmpty(history.errorMessage)}"
                              class="history-error-trigger"
                              th:text="${history.errorMessage}"
                              th:title="${history.errorMessage}">-</span>
                        <textarea th:if="${history.errorMessage != null && !#strings.isEmpty(history.errorMessage)}"
                                  class="history-error-full"
                                  hidden
                                  th:text="${history.errorMessage}"></textarea>
                        <span th:if="${history.errorMessage == null || #strings.isEmpty(history.errorMessage)}">-</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(crawlHistoryList)}">
                    <td colspan="9">크롤링 이력이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </section>

        <div id="historyErrorModalOverlay" class="history-error-modal-overlay" aria-hidden="true">
            <section class="history-error-modal" role="dialog" aria-modal="true" aria-labelledby="historyErrorModalTitle">
                <header class="history-error-modal-header">
                    <h3 id="historyErrorModalTitle">상세 오류</h3>
                </header>
                <div class="history-error-modal-body">
                    <pre id="historyErrorModalContent"></pre>
                </div>
                <footer class="history-error-modal-footer">
                    <button type="button" class="secondary" id="historyErrorModalClose">창닫기</button>
                </footer>
            </section>
        </div>
    </section>
</section>
<aside></aside>
<script th:src="@{/js/admin.js}" src="/js/admin.js"></script>
</body>
</html>
