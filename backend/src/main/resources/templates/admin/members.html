<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layouts/defaultLayout :: layout(~{::title}, ~{::link}, ~{::section}, ~{}, true, false, ~{::aside})}">
<head>
    <title>회원 관리 | Daily Dev Insight</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css">
</head>
<body>
<section class="admin-shell">
    <aside th:replace="~{fragments/adminNav :: adminNav(${currentMenu})}"></aside>
    <section class="admin-content">
        <header class="admin-topbar">
            <h2>회원 관리</h2>
            <p>권한과 상태를 즉시 관리할 수 있습니다.</p>
        </header>

        <div class="alert success" th:if="${adminMessage}" th:text="${adminMessage}"></div>
        <div class="alert error" th:if="${adminError}" th:text="${adminError}"></div>

        <section class="admin-panel">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>PK</th>
                    <th>사용자 ID</th>
                    <th>이메일</th>
                    <th>이름</th>
                    <th>권한</th>
                    <th>상태</th>
                    <th>작업</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="member : ${memberList}">
                    <td th:text="${member.id}">1</td>
                    <td th:text="${member.userId}">user01</td>
                    <td th:text="${member.email}">user01@daily.com</td>
                    <td th:text="${member.name}">홍길동</td>
                    <td>
                        <form method="post" th:action="@{/admin/members/{id}/update(id=${member.id})}" class="inline-form">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <select name="role">
                                <option value="USER" th:selected="${member.role == 'USER'}">USER</option>
                                <option value="ADMIN" th:selected="${member.role == 'ADMIN'}">ADMIN</option>
                            </select>
                    </td>
                    <td>
                            <select name="status">
                                <option value="ACTIVE" th:selected="${member.status == 'ACTIVE'}">ACTIVE</option>
                                <option value="INACTIVE" th:selected="${member.status == 'INACTIVE'}">INACTIVE</option>
                            </select>
                    </td>
                    <td>
                            <button type="submit">저장</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(memberList)}">
                    <td colspan="7">회원 데이터가 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </section>
    </section>
</section>
<aside></aside>
</body>
</html>
