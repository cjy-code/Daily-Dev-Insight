<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layouts/defaultLayout :: layout(~{::title}, ~{::link}, ~{::section}, ~{}, true, false, ~{::aside})}">
<head>
    <title>조회수 통계 | Daily Dev Insight</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css">
</head>
<body>
<section class="admin-shell">
    <aside th:replace="~{fragments/adminNav :: adminNav(${currentMenu})}"></aside>
    <section class="admin-content">
        <header class="admin-topbar">
            <h2>조회수 통계</h2>
            <p>콘텐츠 조회수 현황과 상위 콘텐츠를 확인합니다.</p>
        </header>

        <section class="admin-panel dashboard-zone">
            <div class="dashboard-zone-header">
                <h3>A. 조회수 요약</h3>
                <p>전체/콘텐츠별 조회수 총합입니다.</p>
            </div>
            <div class="stats-grid">
                <article class="stat-card stat-card-time"><span>전체 조회수</span><strong th:text="${viewStats.totalViewCount}">0</strong></article>
                <article class="stat-card stat-card-content"><span>일일 지식 조회수</span><strong th:text="${viewStats.knowledgeViewCount}">0</strong></article>
                <article class="stat-card stat-card-content"><span>테크 뉴스 조회수</span><strong th:text="${viewStats.newsViewCount}">0</strong></article>
            </div>
        </section>

        <section class="admin-panel dashboard-zone">
            <div class="dashboard-zone-header">
                <h3>B. 일일 지식 조회수 Top 5</h3>
                <p>조회수가 높은 순서로 표시합니다.</p>
            </div>
            <table class="admin-table">
                <thead>
                <tr>
                    <th>순위</th>
                    <th>제목</th>
                    <th>조회수</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(viewStats.topKnowledgeList)}">
                    <td colspan="3">데이터가 없습니다.</td>
                </tr>
                <tr th:each="item, state : ${viewStats.topKnowledgeList}">
                    <td th:text="${state.index + 1}">1</td>
                    <td th:text="${item.title}">제목</td>
                    <td th:text="${item.metricValue}">0</td>
                </tr>
                </tbody>
            </table>
        </section>

        <section class="admin-panel dashboard-zone">
            <div class="dashboard-zone-header">
                <h3>C. 테크 뉴스 조회수 Top 5</h3>
                <p>조회수가 높은 순서로 표시합니다.</p>
            </div>
            <table class="admin-table">
                <thead>
                <tr>
                    <th>순위</th>
                    <th>제목</th>
                    <th>조회수</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(viewStats.topNewsList)}">
                    <td colspan="3">데이터가 없습니다.</td>
                </tr>
                <tr th:each="item, state : ${viewStats.topNewsList}">
                    <td th:text="${state.index + 1}">1</td>
                    <td th:text="${item.title}">제목</td>
                    <td th:text="${item.metricValue}">0</td>
                </tr>
                </tbody>
            </table>
        </section>
    </section>
</section>
<aside></aside>
</body>
</html>
