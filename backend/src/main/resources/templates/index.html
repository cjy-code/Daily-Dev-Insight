<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layouts/defaultLayout :: layout(~{::title}, ~{::link}, ~{::section}, ~{::script}, true)}">
<head>
    <title>Daily Dev Insight</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css">
</head>
<body>
<section class="index-page">
    <section class="top-panel">
        <h1>Daily Dev Insight</h1>
        <p class="subtitle">주간 핫 소식, 오늘의 지식, 오늘의 뉴스를 한 화면에서 확인하세요.</p>

        <div class="toolbar">
            <form class="toolbar-form" method="get" action="/index">
                <input type="hidden" id="dateCompat" name="date" th:value="${selectedDate}">

                <div class="toolbar-group group-date group-row-top">
                    <label for="startDate">조회 기간</label>
                    <div class="period-buttons" role="group" aria-label="기간 단축 선택">
                        <button type="button" class="period-btn" data-period-months="1">1개월</button>
                        <button type="button" class="period-btn" data-period-months="3">3개월</button>
                        <button type="button" class="period-btn" data-period-months="6">6개월</button>
                        <button type="button" class="period-btn" data-period-months="12">1년</button>
                    </div>
                    <input id="startDate" name="startDate" type="date" th:value="${startDate}" th:max="${T(java.time.LocalDate).now()}">
                    <span class="date-sep">~</span>
                    <input id="endDate" name="endDate" type="date" th:value="${endDate}" th:max="${T(java.time.LocalDate).now()}">
                </div>

                <div class="toolbar-group group-search group-row-bottom-left">
                    <label for="searchType">검색 조건</label>
                    <select id="searchType" name="searchType">
                        <option value="title" th:selected="${searchType == 'title'}">제목</option>
                        <option value="content" th:selected="${searchType == 'content'}">내용</option>
                        <option value="title_content" th:selected="${searchType == 'title_content'}">제목+내용</option>
                    </select>

                    <label for="keyword">검색어</label>
                    <input id="keyword" name="keyword" type="text" th:value="${keyword}" placeholder="검색어를 입력하세요">
                </div>

                <div class="toolbar-group group-action group-row-bottom-right">
                    <button type="submit">조회</button>
                    <a class="ghost-link" th:href="@{/api/insights(date=${selectedDate})}" target="_blank" rel="noopener">API 확인</a>
                </div>
            </form>
        </div>
    </section>

    <section class="content-section">
        <div class="section-head">
            <h2>주간 핫 소식</h2>
            <p>자동 캐러셀</p>
        </div>

        <div class="hot-carousel" data-hot-carousel th:classappend="${#lists.isEmpty(weeklyHotList)} ? ' is-empty' : ''">
            <button type="button" class="nav-button prev" data-hot-prev aria-label="이전 슬라이드">&#10094;</button>

            <div class="hot-viewport">
                <div class="hot-track" data-hot-track>
                    <article class="hot-card" th:each="item : ${weeklyHotList}">
                        <a class="card-link"
                           th:href="${(item.url != null and !#strings.isEmpty(item.url)) ? item.url : '#'}"
                           th:attr="aria-disabled=${item.url == null or #strings.isEmpty(item.url)}"
                           target="_blank" rel="noopener">
                            <div class="thumb-wrap hot-thumb">
                                <img
                                    th:src="${item.thumbnailUrl != null and !#strings.isEmpty(item.thumbnailUrl)} ? ${item.thumbnailUrl} : @{/images/default-thumb.svg}"
                                    src="/images/default-thumb.svg"
                                    alt="주간 핫 소식 썸네일"
                                    loading="lazy"
                                    onerror="this.onerror=null;this.src='/images/default-thumb.svg';">
                            </div>
                            <div class="card-body">
                                <h3 class="card-title" th:text="${item.title}">핫 소식 제목</h3>
                                <p class="card-summary" th:text="${item.summary}">핫 소식 요약</p>
                                <div class="card-meta" th:text="${item.source + ' | ' + item.publishedAt}">출처 | 날짜</div>
                            </div>
                        </a>
                    </article>
                </div>
            </div>

            <button type="button" class="nav-button next" data-hot-next aria-label="다음 슬라이드">&#10095;</button>
        </div>
        <p class="empty" th:if="${#lists.isEmpty(weeklyHotList)}">주간 핫 소식은 집계 기능 적용 후 제공됩니다.</p>
    </section>

    <section class="content-section">
        <div class="section-head">
            <h2>오늘의 지식</h2>
            <p>고정 6개 카드 수동 슬라이드</p>
        </div>

        <div class="manual-slider" data-manual-slider th:attr="data-total-pages=${#lists.size(dailyKnowledgeChunks)}" th:classappend="${#lists.isEmpty(dailyKnowledgeChunks)} ? ' is-empty' : ''">
            <button type="button" class="nav-button prev" data-prev aria-label="이전 페이지">&#10094;</button>

            <div class="manual-viewport">
                <div class="manual-track" data-track>
                    <div class="manual-page" th:each="chunk : ${dailyKnowledgeChunks}">
                        <article class="content-card" th:each="item : ${chunk}">
                            <a class="card-link"
                               th:href="${(item.url != null and !#strings.isEmpty(item.url)) ? item.url : '#'}"
                               th:attr="aria-disabled=${item.url == null or #strings.isEmpty(item.url)}"
                               target="_blank" rel="noopener">
                                <div class="thumb-wrap">
                                    <img
                                        th:src="${item.thumbnailUrl != null and !#strings.isEmpty(item.thumbnailUrl)} ? ${item.thumbnailUrl} : @{/images/default-thumb.svg}"
                                        src="/images/default-thumb.svg"
                                        alt="오늘의 지식 썸네일"
                                        loading="lazy"
                                        onerror="this.onerror=null;this.src='/images/default-thumb.svg';">
                                </div>
                                <div class="card-body">
                                    <h3 class="card-title" th:text="${item.title}">지식 제목</h3>
                                    <p class="card-summary" th:text="${item.summary}">지식 요약</p>
                                    <div class="card-meta" th:text="${item.source + ' | ' + item.publishedAt}">출처 | 날짜</div>
                                </div>
                            </a>
                        </article>
                    </div>
                </div>
            </div>

            <button type="button" class="nav-button next" data-next aria-label="다음 페이지">&#10095;</button>
        </div>

        <div class="pager-meta" th:if="${!#lists.isEmpty(dailyKnowledgeChunks)}">
            <span data-current-page>1</span>
            <span>/</span>
            <span th:text="${#lists.size(dailyKnowledgeChunks)}">1</span>
        </div>
        <p class="empty" th:if="${#lists.isEmpty(dailyKnowledgeChunks)}">오늘의 지식 데이터가 없습니다.</p>
    </section>

    <section class="content-section">
        <div class="section-head">
            <h2>오늘의 뉴스</h2>
            <p>고정 6개 카드 수동 슬라이드</p>
        </div>

        <div class="manual-slider" data-manual-slider th:attr="data-total-pages=${#lists.size(techNewsChunks)}" th:classappend="${#lists.isEmpty(techNewsChunks)} ? ' is-empty' : ''">
            <button type="button" class="nav-button prev" data-prev aria-label="이전 페이지">&#10094;</button>

            <div class="manual-viewport">
                <div class="manual-track" data-track>
                    <div class="manual-page" th:each="chunk : ${techNewsChunks}">
                        <article class="content-card" th:each="item : ${chunk}">
                            <a class="card-link"
                               th:href="${(item.url != null and !#strings.isEmpty(item.url)) ? item.url : '#'}"
                               th:attr="aria-disabled=${item.url == null or #strings.isEmpty(item.url)}"
                               target="_blank" rel="noopener">
                                <div class="thumb-wrap">
                                    <img
                                        th:src="${item.thumbnailUrl != null and !#strings.isEmpty(item.thumbnailUrl)} ? ${item.thumbnailUrl} : @{/images/default-thumb.svg}"
                                        src="/images/default-thumb.svg"
                                        alt="오늘의 뉴스 썸네일"
                                        loading="lazy"
                                        onerror="this.onerror=null;this.src='/images/default-thumb.svg';">
                                </div>
                                <div class="card-body">
                                    <h3 class="card-title" th:text="${item.title}">뉴스 제목</h3>
                                    <p class="card-summary" th:text="${item.summary}">뉴스 요약</p>
                                    <div class="card-meta" th:text="${item.source + ' | ' + item.publishedAt}">출처 | 날짜</div>
                                </div>
                            </a>
                        </article>
                    </div>
                </div>
            </div>

            <button type="button" class="nav-button next" data-next aria-label="다음 페이지">&#10095;</button>
        </div>

        <div class="pager-meta" th:if="${!#lists.isEmpty(techNewsChunks)}">
            <span data-current-page>1</span>
            <span>/</span>
            <span th:text="${#lists.size(techNewsChunks)}">1</span>
        </div>
        <p class="empty" th:if="${#lists.isEmpty(techNewsChunks)}">오늘의 뉴스 데이터가 없습니다.</p>
    </section>
</section>

<script th:src="@{/js/index.js}" src="/js/index.js"></script>
</body>
</html>
