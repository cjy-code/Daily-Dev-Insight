<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Dev Insight</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" href="/css/index.css">
</head>
<body>
<div class="container">
    <section class="card">
        <h1>Daily Dev Insight</h1>
        <p class="subtitle">오늘의 지식 1건과 기술 뉴스를 날짜별로 조회합니다.</p>

        <div class="toolbar">
            <form class="toolbar-form" method="get" action="/index">
                <label for="date">조회 날짜</label>
                <input id="date" name="date" type="date" th:value="${selectedDate}" th:max="${T(java.time.LocalDate).now()}" required>
                <button type="submit">조회</button>
                <a th:href="@{/api/insights(date=${selectedDate})}" target="_blank" rel="noopener">API 확인</a>
            </form>
            <form method="post" th:action="@{/auth/logout}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="logout-button" type="submit">로그아웃</button>
            </form>
        </div>
    </section>

    <section class="card">
        <h2>오늘의 지식 1건</h2>
        <div th:if="${response.todayKnowledge != null}">
            <h3 class="item-title">
                <a th:if="${response.todayKnowledge.url != null and !#strings.isEmpty(response.todayKnowledge.url)}"
                   th:href="${response.todayKnowledge.url}" target="_blank" rel="noopener"
                   th:text="${response.todayKnowledge.title}">지식 제목</a>
                <span th:if="${response.todayKnowledge.url == null or #strings.isEmpty(response.todayKnowledge.url)}"
                      th:text="${response.todayKnowledge.title}">지식 제목</span>
            </h3>
            <div class="meta"
                 th:text="${response.todayKnowledge.source + ' | ' + response.todayKnowledge.publishedAt}">분류 | 날짜</div>
            <p class="summary" th:text="${response.todayKnowledge.summary}">요약</p>
        </div>
        <p class="empty" th:if="${response.todayKnowledge == null}">선택한 날짜의 지식 데이터가 없습니다.</p>
    </section>

    <section class="card">
        <h2>오늘의 뉴스 리스트</h2>
        <ul class="news-list" th:if="${!#lists.isEmpty(response.newsList)}">
            <li class="news-item" th:each="item : ${response.newsList}">
                <h3 class="item-title">
                    <a th:href="${item.url}" target="_blank" rel="noopener" th:text="${item.title}">뉴스 제목</a>
                </h3>
                <div class="meta" th:text="${item.source + ' | ' + item.publishedAt}">출처 | 날짜</div>
                <p class="summary" th:text="${item.summary}">요약</p>
            </li>
        </ul>
        <p class="empty" th:if="${#lists.isEmpty(response.newsList)}">선택한 날짜의 뉴스 데이터가 없습니다.</p>
    </section>
</div>
</body>
</html>
