<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<body>
<header class="site-header card" th:fragment="header(showNav)">
    <div>
        <h1 class="brand-title">Daily Dev Insight</h1>
        <p class="brand-subtitle">Developer-first login experience template</p>
    </div>
    <nav class="header-nav" aria-label="Global" th:if="${showNav}">
        <a class="header-link" th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">관리자</a>
        <form method="post" th:action="@{/auth/logout}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="header-link header-link-button">로그아웃</button>
        </form>
    </nav>
</header>
</body>
</html>
