<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<body>
<header class="site-header" th:fragment="header(showNav)">
    <a class="brand-lockup" th:href="@{/}">
        <img class="brand-logo-img" th:src="@{/images/brand-logo-trimmed.png}" src="/images/brand-logo-trimmed.png" alt="Daily Dev Insight - Developer Insight Digest">
    </a>
    <nav class="header-nav" aria-label="Global" th:if="${showNav}">
        <a class="header-link header-icon-link" th:href="@{/mypage}" sec:authorize="isAuthenticated()" aria-label="마이페이지">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.2-6 7-6s7 2.4 7 6"/></svg>
        </a>
        <form method="post" th:action="@{/auth/logout}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="header-link header-link-button">로그아웃</button>
        </form>
    </nav>
</header>
</body>
</html>
